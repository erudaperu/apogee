<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title description" role="img" viewBox="0 0 1600 1000"><title id="title">APOGEE — conceptual model rocket and planned instrumentation</title><desc id="description">An editable engineering illustration of a planned model rocket. The external elevation identifies its nose cone, airframe, fins, conceptual avionics bay and external commercial-motor interface. A separate planned data-flow diagram connects sensor acquisition, firmware and logging, ground replay, and offline analysis. Concept only, not to scale. No propulsion internals, dimensions, built hardware or flight performance are depicted.</desc><defs><radialGradient id="paper" cx="66%" cy="37%" r="83%"><stop stop-color="#172d40"/><stop offset=".56" stop-color="#102132"/><stop offset="1" stop-color="#0b1523"/></radialGradient><linearGradient id="shell" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#d8ece5" stop-opacity=".05"/><stop offset=".48" stop-color="#d8ece5" stop-opacity=".01"/><stop offset="1" stop-color="#7de2ca" stop-opacity=".085"/></linearGradient><pattern id="section-hatch" width="12" height="12" patternTransform="rotate(-40)" patternUnits="userSpaceOnUse"><path stroke="#9fc7ca" stroke-opacity=".31" stroke-width="1" d="M0 0V12"/></pattern><pattern id="light-hatch" width="8" height="8" patternTransform="rotate(40)" patternUnits="userSpaceOnUse"><path stroke="#7de2ca" stroke-opacity=".28" stroke-width="1" d="M0 0V8"/></pattern><marker id="flow-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#7de2ca" stroke-linejoin="round" stroke-width="1.3" d="M1 1L9 5L1 9"/></marker><style>.type{font-family:Arial,Helvetica,sans-serif;fill:#edf1e8}.label{font-size:29px;letter-spacing:2.6px;font-weight:500}.support{font-size:20px;letter-spacing:1.7px;fill:#92adbb}.flow-caption{font-size:23px;letter-spacing:1px;fill:#b6cbd1}.accent{fill:none;stroke-linejoin:round;stroke-