L1187 20" stroke="#527893" stroke-width="1" fill="none"/><path d="M1180 13 L1180 27" stroke="#527893" stroke-width="1" fill="none"/><path d="M13 590 L27 590" stroke="#527893" stroke-width="1" fill="none"/><path d="M20 583 L20 597" stroke="#527893" stroke-width="1" fill="none"/><path d="M1173 590 L1187 590" stroke="#527893" stroke-width="1" fill="none"/><path d="M1180 583 L1180 597" stroke="#527893" stroke-width="1" fill="none"/><text x="42" y="52" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.4">APOGEE / SYSTEM MAP</text><text x="42" y="86" fill="#FF9B61" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">PROPOSED ARCHITECTURE · MODEL ROCKET + MEASUREMENT SYSTEM</text><rect x="42" y="128" width="305" height="107" rx="0" fill="#0A1E34" stroke="#67D7EF"/><text x="60" y="168" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3">MODEL + CAD</text><text x="60" y="206" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Geometry / packaging / assumptions</text><rect x="42" y="311" width="305" height="107" rx="0" fill="#0A1E34" stroke="#67D7EF"/><text x="60" y="351" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3">ROCKET + SENSORS</text><text x="60" y="389" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Physical assembly / measurements</text><rect x="428" y="311" width="330" height="107" rx="0" fill="#0A1E34" stroke="#67D7EF"/><text x="446" y="351" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3">FIRMWARE + LOGGER</text><text x="446" y="389" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Acquisition / time / quality flags</text><rect x="839" y="311" width="319" height="107" rx="0" fill="#0A1E34" stroke="#67D7EF"/><text x="857" y="351" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3">GROUND SOFTWARE</text><text x="857" y="389" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Replay / inspection / export</text><rect x="839" y="128" width="319" height="107" rx="0" fill="#0A1E34" stroke="#67D7EF"/><text x="857" y="168" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3">OFFLINE ANALYSIS</text><text x="857" y="206" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Compare / explain / evaluate</text><path d="M194 245 L194 300" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M189 292 L194 300 L199 292" stroke="#67D7EF" stroke-width="2" fill="none"/><text x="214" y="279" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">DESIGN</text><path d="M358 364 L417 364" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M409 359 L417 364 L409 369" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M769 364 L828 364" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M820 359 L828 364 L820 369" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M998 300 L998 246" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M993 254 L998 246 L1003 254" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M358 181 L828 181" stroke="#67D7EF" stroke-width="2" fill="none"/><path d="M820 176 L828 181 L820 186" stroke="#67D7EF" stroke-width="2" fill="none"/><text x="465" y="165" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">REFERENCE SCENARIOS</text><path d="M42 475 L1158 475" stroke="#527893" stroke-width="1" fill="none"/><text x="42" y="517" fill="#F2F8FC" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="-0.3">BUILD → MEASURE → REPLAY → COMPARE</text><text x="42" y="557" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" letter-spacing="0">I will use the same data contract for synthetic scenarios, bench recordings and later flight observations.</text><text x="42" y="589" fill="#A5BDD0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Commercial propulsion is a separate subsystem. My first avionics collect data; AI stays in offline analysis.</text></svg>
