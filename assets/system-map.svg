<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" aria-labelledby="title desc" role="img" viewBox="0 0 1200 610"><title id="title">APOGEE proposed system architecture</title><desc id="desc">Models and CAD inform the physical rocket and sensors. Firmware records measurements for ground replay and offline comparison with reference scenarios. Proposed, not implemented.</desc><rect width="1200" height="610" x="0" y="0" fill="#0D1117" stroke="none" rx="0"/><path fill="none" stroke="#303943" stroke-width="1" d="M13 20 L27 20"/><path fill="none" stroke="#303943" stroke-width="1" d="M20 13 L20 27"/><path fill="none" stroke="#303943" stroke-width="1" d="M1173 20 L1187 20"/><path fill="none" stroke="#303943" stroke-width="1" d="M1180 13 L1180 27"/><path fill="none" stroke="#303943" stroke-width="1" d="M13 590 L27 590"/><path fill="none" stroke="#303943" stroke-width="1" d="M20 583 L20 597"/><path fill="none" stroke="#303943" stroke-width="1" d="M1173 590 L1187 590"/><path fill="none" stroke="#303943" stroke-width="1" d="M1180 583 L1180 597"/><text x="42" y="52" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-.4">APOGEE / SYSTEM MAP</text><text x="42" y="86" fill="#E7B785" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">PROPOSED ARCHITECTURE · MODEL ROCKET + MEASUREMENT SYSTEM</text><rect width="305" height="107" x="42" y="128" fill="#0D1117" stroke="#69D4D0" rx="0"/><text x="60" y="168" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-.3">MODEL + CAD</text><text x="60" y="206" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Geometry / packaging / assumptions</text><rect width="305" height="107" x="42" y="311" fill="#0D1117" stroke="#69D4D0" rx="0"/><text x="60" y="351" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-.3">ROCKET + SENSORS</text><text x="60" y="389" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Physical assembly / measurements</text><rect width="330" height="107" x="428" y="311" fill="#0D1117" stroke="#69D4D0" rx="0"/><text x="446" y="351" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-.3">FIRMWARE + LOGGER</text><text x="446" y="389" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Acquisition / time / quality flags</text><rect width="319" height="107" x="839" y="311" fill="#0D1117" stroke="#69D4D0" rx="0"/><text x="857" y="351" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-.3">GROUND SOFTWARE</text><text x="857" y="389" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Replay / inspection / export</text><rect width="319" height="107" x="839" y="128" fill="#0D1117" stroke="#69D4D0" rx="0"/><text x="857" y="168" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-.3">OFFLINE ANALYSIS</text><text x="857" y="206" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Compare / explain / evaluate</text><path fill="none" stroke="#69D4D0" stroke-width="2" d="M194 245 L194 300"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M189 292 L194 300 L199 292"/><text x="214" y="279" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">DESIGN</text><path fill="none" stroke="#69D4D0" stroke-width="2" d="M358 364 L417 364"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M409 359 L417 364 L409 369"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M769 364 L828 364"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M820 359 L828 364 L820 369"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M998 300 L998 246"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M993 254 L998 246 L1003 254"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M358 181 L828 181"/><path fill="none" stroke="#69D4D0" stroke-width="2" d="M820 176 L828 181 L820 186"/><text x="465" y="165" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">REFERENCE SCENARIOS</text><path fill="none" stroke="#303943" stroke-width="1" d="M42 475 L1158 475"/><text x="42" y="517" fill="#F2F4F5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="-.3">BUILD → MEASURE → REPLAY → COMPARE</text><text x="42" y="557" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" letter-spacing="0">I will use the same data contract for synthetic scenarios, bench recordings and later flight observations.</text><text x="42" y="589" fill="#A1ADB9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Commercial propulsion is a separate subsystem. My first avionics collect data; AI stays in offline analysis.</text></svg>